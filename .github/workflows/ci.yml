name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  ci:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version-file: .python-version
      - run: uv sync
      - run: uv run pytest
      - run: uv run ruff check .
      - run: uv run ruff format --check .
